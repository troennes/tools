<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CSS minifier</title>
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <style>
    textarea { font-family: var(--font-mono); font-size: var(--size-small); }
    #min { word-break: break-all; }
  </style>
</head>
<body>
  <header>
    <nav class="container slim">
      <ul><li><a href="../index.html">← Tools</a></li></ul>
    </nav>
  </header>

  <main class="container slim flow">
    <hgroup>
      <h1>CSS minifier</h1>
      <p>Type in either field: CSS is minified, minified CSS is beautified. Only comments and whitespace are removed.</p>
    </hgroup>

    <div class="flow-tight">
      <label for="css">CSS</label>
      <textarea id="css" rows="12" spellcheck="false"></textarea>
    </div>

    <div class="flow-tight">
      <div class="repel">
        <label for="min">Minified</label>
        <div class="cluster gap-2xs">
          <button type="button" id="copy" class="neutral small">Copy</button>
          <button type="button" id="download" class="neutral small">Download</button>
        </div>
      </div>
      <textarea id="min" rows="6" spellcheck="false"></textarea>
      <small id="savings" hidden></small>
    </div>
  </main>

<script>
(() => {
  const css = document.getElementById("css");
  const min = document.getElementById("min");
  const savings = document.getElementById("savings");

  const URL_START = /url\(\s*[^\s"')]/iy;
  function isUrl(src, i) {
    URL_START.lastIndex = i;
    return URL_START.test(src) && !/[\w-]/.test(src[i - 1] ?? "");
  }

  // Splits CSS into single characters, " " for any whitespace run, and atoms that must
  // stay intact: comments, strings, unquoted url(...) and backslash escapes.
  function tokenize(src) {
    const tokens = [];
    let i = 0;
    while (i < src.length) {
      const ch = src[i];
      let end = i + 1;
      if (ch === "/" && src[i + 1] === "*") {
        end = src.indexOf("*/", i + 2);
        end = end < 0 ? src.length : end + 2;
      } else if (ch === '"' || ch === "'") {
        while (end < src.length && src[end] !== ch && src[end] !== "\n") end += src[end] === "\\" ? 2 : 1;
        end = Math.min(end + 1, src.length);
      } else if (isUrl(src, i)) {
        end = src.indexOf(")", i);
        end = end < 0 ? src.length : end + 1;
        const closed = src[end - 1] === ")";
        tokens.push("url(" + src.slice(i + 4, closed ? end - 1 : end).trim() + (closed ? ")" : ""));
        i = end;
        continue;
      } else if (ch === "\\") {
        end = Math.min(i + 2, src.length);
      } else if (/\s/.test(ch)) {
        while (end < src.length && /\s/.test(src[end])) end++;
        tokens.push(" ");
        i = end;
        continue;
      }
      tokens.push(src.slice(i, end));
      i = end;
    }
    return tokens;
  }

  const isComment = (t) => t.startsWith("/*");

  // For each token: is it in a selector or at-rule prelude (the next of { ; } is "{"),
  // and how deep inside parentheses is it?
  function context(tokens) {
    const prelude = new Array(tokens.length);
    let next = "}";
    for (let i = tokens.length - 1; i >= 0; i--) {
      if ("{;}".includes(tokens[i]) && tokens[i].length === 1) next = tokens[i];
      prelude[i] = next === "{";
    }
    const depth = new Array(tokens.length);
    let d = 0;
    tokens.forEach((t, i) => {
      if (t === ")") d = Math.max(0, d - 1);
      depth[i] = d;
      if (t === "(") d++;
    });
    return { prelude, depth };
  }

  // Can the whitespace between prev and next go without changing meaning?
  function dropSpace(prev, next, inPrelude, depth) {
    const p = prev.length === 1 ? prev : "", n = next.length === 1 ? next : "";
    if (p && "{};,>~!/(:".includes(p)) return true;
    if (n && "{};,>~!/)".includes(n)) return true;
    if (n === ":") return !inPrelude;                  // ".a :hover" differs from ".a:hover"
    if (p === "+" || n === "+") return inPrelude && depth === 0; // calc() needs spaces around +
    return false;
  }

  function minify(src) {
    const tokens = tokenize(src).filter((t) => !isComment(t) || t.startsWith("/*!"));
    const { prelude, depth } = context(tokens);
    const out = [];
    tokens.forEach((t, i) => {
      if (t === " ") {
        const next = tokens[i + 1];
        if (out.length && next && next !== " " && !dropSpace(out.at(-1), next, prelude[i], depth[i])) out.push(" ");
      } else {
        if (t === "}" && out.at(-1) === ";") out.pop();
        out.push(t);
      }
    });
    return out.join("");
  }

  function beautify(src) {
    const tokens = tokenize(src);
    const { prelude, depth } = context(tokens);
    const lines = [];
    let line = "", indent = 0;
    const flush = () => {
      if (line.trim()) lines.push("  ".repeat(indent) + line.trim());
      line = "";
    };
    tokens.forEach((t, i) => {
      if (t === "{") {
        line = line.trimEnd() + " {";
        flush();
        indent++;
      } else if (t === "}") {
        // Give the last declaration its semicolon back.
        if (line.trim() && !isComment(line.trim())) line = line.trimEnd() + ";";
        flush();
        indent = Math.max(0, indent - 1);
        line = "}";
        flush();
        if (indent === 0) lines.push("");
      } else if (t === ";") {
        line = line.trimEnd() + ";";
        flush();
      } else if (isComment(t)) {
        flush();
        line = t;
        flush();
      } else if (t === " ") {
        if (line && !line.endsWith(" ")) line += " ";
      } else if (t === ":" && (prelude[i] ? depth[i] > 0 && line.trimStart().startsWith("@") : depth[i] === 0)) {
        line = line.trimEnd() + ": ";
      } else if (t === ",") {
        line = line.trimEnd() + ", ";
      } else if (">~+".includes(t) && prelude[i] && depth[i] === 0) {
        line = line.trimEnd() + ` ${t} `;
      } else if (t === "!") {
        line = line.trimEnd() + " !";
      } else {
        line += t;
      }
    });
    flush();
    while (lines.at(-1) === "") lines.pop();
    return lines.join("\n");
  }

  const size = (s) => new TextEncoder().encode(s).length;
  const fmt = (n) => (n < 1024 ? `${n} bytes` : `${(n / 1024).toFixed(1)} KB`);

  function showSavings() {
    const before = size(css.value), after = size(min.value);
    savings.hidden = !before;
    if (before) savings.textContent = `${fmt(before)} → ${fmt(after)} (${Math.round((1 - after / before) * 100)}% smaller)`;
  }

  css.addEventListener("input", () => {
    min.value = minify(css.value);
    showSavings();
  });
  min.addEventListener("input", () => {
    css.value = beautify(min.value);
    showSavings();
  });

  const copy = document.getElementById("copy");
  copy.addEventListener("click", async () => {
    await navigator.clipboard.writeText(min.value);
    copy.textContent = "Copied";
    setTimeout(() => (copy.textContent = "Copy"), 1200);
  });

  document.getElementById("download").addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([min.value], { type: "text/css" }));
    a.download = "styles.min.css";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
})();
</script>
</body>
</html>
