<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Image crop and resize</title>
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <style>
    .stage {
      position: relative;
      inline-size: fit-content;
      margin-inline: auto;
      overflow: hidden;
      line-height: 0;
      touch-action: none;
      user-select: none;
    }
    .stage img { max-inline-size: 100%; max-block-size: 70vh; }
    #crop {
      position: absolute;
      box-shadow: inset 0 0 0 2px white, 0 0 0 100vmax rgb(0 0 0 / 0.55);
      cursor: move;
    }
    #crop span {
      position: absolute;
      inline-size: 16px;
      block-size: 16px;
      background: white;
      border: 1px solid rgb(0 0 0 / 0.5);
    }
    #crop [data-corner="nw"] { inset: -1px auto auto -1px; cursor: nwse-resize; }
    #crop [data-corner="ne"] { inset: -1px -1px auto auto; cursor: nesw-resize; }
    #crop [data-corner="sw"] { inset: auto auto -1px -1px; cursor: nesw-resize; }
    #crop [data-corner="se"] { inset: auto -1px -1px auto; cursor: nwse-resize; }
  </style>
</head>
<body>
  <header>
    <nav class="container slim">
      <ul><li><a href="../index.html">← Tools</a></li></ul>
    </nav>
  </header>

  <main class="container slim flow">
    <hgroup>
      <h1>Image crop and resize</h1>
      <p>Crop and resize an image, then download it as PNG, JPEG or WebP. Nothing is uploaded.</p>
    </hgroup>

    <div class="flow-tight">
      <label for="file">Image</label>
      <input type="file" id="file" accept="image/*">
      <small id="file-note">You can also paste an image or drop one anywhere on the page.</small>
    </div>

    <div id="editor" class="flow" hidden>
      <div class="flow-tight">
        <label for="aspect">Aspect ratio</label>
        <select id="aspect">
          <option value="">Free</option>
          <option value="1">1:1</option>
          <option value="1.3333333333">4:3</option>
          <option value="1.5">3:2</option>
          <option value="1.7777777778">16:9</option>
          <option value="0.5625">9:16</option>
        </select>
      </div>

      <div class="flow-tight">
        <div class="stage">
          <img id="img" alt="Image being cropped" draggable="false">
          <div id="crop" role="img" aria-label="Crop area">
            <span data-corner="nw"></span><span data-corner="ne"></span>
            <span data-corner="sw"></span><span data-corner="se"></span>
          </div>
        </div>
        <small id="info"></small>
      </div>

      <div class="grid" style="--grid-min-size: 8rem;">
        <div class="flow-tight">
          <label for="width">Width (px)</label>
          <input type="number" id="width" min="1" max="16384">
        </div>
        <div class="flow-tight">
          <label for="height">Height (px)</label>
          <input type="number" id="height" min="1" max="16384">
        </div>
        <div class="flow-tight">
          <label for="percent">Scale (%)</label>
          <input type="number" id="percent" min="1" max="1000" step="any">
        </div>
      </div>

      <div class="grid" style="--grid-min-size: 8rem;">
        <div class="flow-tight">
          <label for="format">Format</label>
          <select id="format">
            <option value="image/png">PNG</option>
            <option value="image/jpeg">JPEG</option>
            <option value="image/webp">WebP</option>
          </select>
        </div>
        <div class="flow-tight" id="quality-field" hidden>
          <label for="quality">Quality: <output id="quality-out" for="quality">90</output></label>
          <input type="range" id="quality" min="40" max="100" value="90">
        </div>
      </div>

      <div class="cluster gap-xs">
        <button type="button" id="download">Download</button>
        <button type="button" id="copy" class="neutral">Copy</button>
      </div>
    </div>
  </main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const img = $("img"), crop = $("crop"), aspect = $("aspect");
  const width = $("width"), height = $("height"), percent = $("percent");
  const format = $("format"), quality = $("quality");

  // Crop box in source pixels. Output size is the crop size times `scale`.
  let box = { x: 0, y: 0, w: 0, h: 0 };
  let scale = 1;
  let name = "image";
  let url = null;

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const W = () => img.naturalWidth, H = () => img.naturalHeight;
  const ratio = () => Number(aspect.value) || null;

  function render() {
    Object.assign(crop.style, {
      left: (box.x / W()) * 100 + "%",
      top: (box.y / H()) * 100 + "%",
      width: (box.w / W()) * 100 + "%",
      height: (box.h / H()) * 100 + "%",
    });
    const r = Object.fromEntries(Object.entries(box).map(([k, v]) => [k, Math.round(v)]));
    $("info").textContent = `Image ${W()} × ${H()} · crop ${r.w} × ${r.h} at ${r.x}, ${r.y}`;
    showSize();
  }

  const outputSize = () => [box.w, box.h].map((v) => Math.max(1, Math.round(Math.round(v) * scale)));

  function showSize() {
    [width.value, height.value] = outputSize();
    percent.value = Number((scale * 100).toFixed(1));
  }

  // The largest box with the chosen ratio, centered; the whole image when the ratio is free.
  function resetBox() {
    const r = ratio();
    let w = W(), h = H();
    if (r) [w, h] = w / h > r ? [h * r, h] : [w, w / r];
    box = { x: (W() - w) / 2, y: (H() - h) / 2, w, h };
    render();
  }

  async function load(file) {
    if (!file) return;
    const next = URL.createObjectURL(file);
    try {
      img.src = next;
      await img.decode();
    } catch {
      URL.revokeObjectURL(next);
      $("file-note").textContent = "That file isn't an image this browser can open.";
      $("file").setAttribute("aria-invalid", "true");
      $("editor").hidden = true;
      return;
    }
    if (url) URL.revokeObjectURL(url);
    url = next;
    name = file.name ? file.name.replace(/\.[^.]+$/, "") : "pasted-image";
    $("file-note").textContent = `${file.name || "Pasted image"} (${file.size.toLocaleString()} bytes).`;
    $("file").removeAttribute("aria-invalid");
    $("editor").hidden = false;
    scale = 1;
    resetBox();
  }

  $("file").addEventListener("change", () => load($("file").files[0]));

  document.addEventListener("paste", (e) => {
    const file = [...e.clipboardData.files].find((f) => f.type.startsWith("image/"));
    if (file) {
      e.preventDefault();
      load(file);
    }
  });
  document.addEventListener("dragover", (e) => e.preventDefault());
  document.addEventListener("drop", (e) => {
    e.preventDefault();
    load(e.dataTransfer.files[0]);
  });

  // Dragging: inside the box moves it, a corner handle resizes it from the opposite corner.
  let drag = null;
  const toSource = (e) => {
    const r = img.getBoundingClientRect();
    return {
      x: clamp(((e.clientX - r.left) * W()) / r.width, 0, W()),
      y: clamp(((e.clientY - r.top) * H()) / r.height, 0, H()),
    };
  };

  crop.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    crop.setPointerCapture(e.pointerId);
    drag = { corner: e.target.dataset.corner, start: toSource(e), box: { ...box } };
  });

  crop.addEventListener("pointermove", (e) => {
    if (!drag) return;
    const p = toSource(e), b = drag.box;
    if (!drag.corner) {
      box.x = clamp(b.x + p.x - drag.start.x, 0, W() - b.w);
      box.y = clamp(b.y + p.y - drag.start.y, 0, H() - b.h);
    } else {
      const right = drag.corner.includes("e"), down = drag.corner.includes("s");
      const ax = right ? b.x : b.x + b.w, ay = down ? b.y : b.y + b.h;
      // The dragged corner follows the pointer's movement, so grabbing a handle off-center doesn't jump.
      const cx = (right ? b.x + b.w : b.x) + p.x - drag.start.x;
      const cy = (down ? b.y + b.h : b.y) + p.y - drag.start.y;
      const min = Math.min(10, W(), H());
      let w = Math.max(min, right ? cx - ax : ax - cx);
      let h = Math.max(min, down ? cy - ay : ay - cy);
      const maxW = right ? W() - ax : ax, maxH = down ? H() - ay : ay;
      const r = ratio();
      if (r) {
        if (w / h > r) h = w / r;
        else w = h * r;
        if (w > maxW) [w, h] = [maxW, maxW / r];
        if (h > maxH) [w, h] = [maxH * r, maxH];
      } else {
        w = Math.min(w, maxW);
        h = Math.min(h, maxH);
      }
      box = { x: right ? ax : ax - w, y: down ? ay : ay - h, w, h };
    }
    render();
  });

  const endDrag = () => (drag = null);
  crop.addEventListener("pointerup", endDrag);
  crop.addEventListener("pointercancel", endDrag);

  aspect.addEventListener("input", resetBox);

  // Width, height and scale are linked through the crop's proportions; the edited field keeps its value.
  const sizeInput = (input, toScale) => input.addEventListener("input", () => {
    const v = Number(input.value);
    if (!(v > 0)) return;
    // Canvases can't be larger than 16384 px on a side.
    scale = Math.min(toScale(v), 16384 / Math.round(Math.max(box.w, box.h)));
    const typed = input.value;
    showSize();
    input.value = typed;
  });
  sizeInput(width, (v) => Math.round(v) / Math.round(box.w));
  sizeInput(height, (v) => Math.round(v) / Math.round(box.h));
  sizeInput(percent, (v) => v / 100);

  format.addEventListener("input", () => ($("quality-field").hidden = format.value === "image/png"));
  quality.addEventListener("input", () => ($("quality-out").value = quality.value));

  // Draws the crop at the output size and encodes it.
  function encode(type) {
    const [ow, oh] = outputSize();
    const canvas = document.createElement("canvas");
    canvas.width = ow;
    canvas.height = oh;
    const ctx = canvas.getContext("2d");
    if (type === "image/jpeg") {
      ctx.fillStyle = "#fff"; // JPEG has no transparency
      ctx.fillRect(0, 0, ow, oh);
    }
    ctx.imageSmoothingQuality = "high";
    const r = Object.fromEntries(Object.entries(box).map(([k, v]) => [k, Math.round(v)]));
    ctx.drawImage(img, r.x, r.y, r.w, r.h, 0, 0, ow, oh);
    return new Promise((resolve) => canvas.toBlob(resolve, type, Number(quality.value) / 100));
  }

  $("download").addEventListener("click", async () => {
    const [ow, oh] = outputSize();
    const blob = await encode(format.value);
    // Browsers without WebP encoding fall back to PNG, so name the file after what we got.
    const ext = { "image/png": "png", "image/jpeg": "jpg", "image/webp": "webp" }[blob.type];
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${name}-${ow}x${oh}.${ext}`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  // The clipboard only takes PNG. The item gets the unfinished blob so the write starts
  // within the click, which Safari requires.
  const copy = $("copy");
  copy.addEventListener("click", async () => {
    try {
      await navigator.clipboard.write([new ClipboardItem({ "image/png": encode("image/png") })]);
      copy.textContent = "Copied";
    } catch {
      copy.textContent = "Copy failed";
    }
    setTimeout(() => (copy.textContent = "Copy"), 1200);
  });
})();
</script>
</body>
</html>
