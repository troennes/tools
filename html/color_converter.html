<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Color converter</title>
  <link rel="stylesheet" href="../styles/style.css">
  <style>
    .swatch {
      block-size: 8rem;
      border: var(--border-width) solid var(--color-border-weak);
      border-radius: var(--border-radius-m);
    }
    input[type="color"] { flex: none; inline-size: 4rem; }
    #outputs :is(th, td) { padding-inline: var(--space-2xs); }
    #outputs th { white-space: nowrap; }
    #outputs td:last-child { inline-size: 1%; }
  </style>
</head>
<body>
  <header>
    <nav class="container slim">
      <ul><li><a href="../index.html">← Tools</a></li></ul>
    </nav>
  </header>

  <main class="container slim flow">
    <hgroup>
      <h1>Color converter</h1>
      <p>Enter any CSS color to get it in every common format.</p>
    </hgroup>

    <div class="flow-tight">
      <label for="color">Color</label>
      <fieldset role="group">
        <input id="color" type="text" value="#7aa2ff" spellcheck="false" autocomplete="off">
        <input id="picker" type="color" value="#7aa2ff" aria-label="Pick color">
      </fieldset>
      <small id="error" hidden>Not a valid CSS color.</small>
    </div>

    <div class="swatch" id="swatch" role="img" aria-label="Color preview"></div>
    <p class="alert warning" id="gamut" hidden>Outside the sRGB gamut. Hex, RGB and HSL show the closest sRGB color, with chroma reduced.</p>

    <table class="full-width">
      <tbody id="outputs"></tbody>
    </table>
  </main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const input = $("color"), picker = $("picker");

  const formats = ["Hex", "RGB", "HSL", "OKLCH", "OKLab", "Lab", "LCH", "Display P3"];
  for (const name of formats) {
    const id = "out-" + name.toLowerCase().replace(" ", "-");
    $("outputs").insertAdjacentHTML("beforeend", `
      <tr>
        <th scope="row">${name}</th>
        <td><code id="${id}"></code></td>
        <td><button type="button" class="neutral small" data-copy="${id}" aria-label="Copy ${name}">Copy</button></td>
      </tr>`);
  }

  // The browser does all parsing and conversion: relative color syntax such as
  // oklch(from <color> l c h) computes to plain numbers we can read back.
  const probe = document.body.appendChild(document.createElement("div"));
  probe.hidden = true;

  function channels(css) {
    probe.style.color = css;
    const body = getComputedStyle(probe).color.replace(/^[\w-]+\((?:[a-z][\w-]*\s+)?|\)$/g, "");
    const [c, alpha] = body.split("/");
    return { c: c.trim().split(/\s+/).map((v) => Number(v) || 0), alpha: alpha === undefined ? 1 : Number(alpha) };
  }

  const n = (x, digits) => String(Number(x.toFixed(digits)));
  const withAlpha = (alpha) => (alpha < 1 ? ` / ${n(alpha * 100, 1)}%` : "");
  const inGamut = (rgb) => rgb.every((v) => v >= -1e-4 && v <= 1 + 1e-4);
  const toSrgb = (css) => channels(`color(from ${css} srgb r g b)`).c;

  // Reduce OKLCH chroma until the color fits sRGB, keeping lightness and hue.
  function srgbFor(color) {
    const rgb = toSrgb(color);
    if (inGamut(rgb)) return { rgb, mapped: false };
    const [l, c, h] = channels(`oklch(from ${color} l c h)`).c;
    let lo = 0, hi = c;
    for (let i = 0; i < 20; i++) {
      const mid = (lo + hi) / 2;
      if (inGamut(toSrgb(`oklch(${l} ${mid} ${h})`))) lo = mid;
      else hi = mid;
    }
    return { rgb: toSrgb(`oklch(${l} ${lo} ${h})`).map((v) => Math.min(1, Math.max(0, v))), mapped: true };
  }

  function rgbToHsl([r, g, b]) {
    const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
    const l = (max + min) / 2;
    if (d === 0) return [0, 0, l];
    const s = d / (1 - Math.abs(2 * l - 1));
    const h = max === r ? ((g - b) / d + 6) % 6 : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    return [h * 60, s, l];
  }

  // Hue is meaningless when chroma rounds to zero (greys), so print 0 instead of noise.
  const hue = (c, h, cDigits) => (Number(c.toFixed(cDigits)) === 0 ? 0 : h);

  function convert(color) {
    const { rgb, mapped } = srgbFor(color);
    const { alpha } = channels(`color(from ${color} srgb r g b / alpha)`);
    const bytes = rgb.map((v) => Math.round(v * 255));
    const hex = "#" + [...bytes, ...(alpha < 1 ? [Math.round(alpha * 255)] : [])]
      .map((v) => v.toString(16).padStart(2, "0")).join("");
    const [hh, s, l] = rgbToHsl(rgb);
    const [okL, okC, okH] = channels(`oklch(from ${color} l c h)`).c;
    const [oL, oA, oB] = channels(`oklab(from ${color} l a b)`).c;
    const [labL, labA, labB] = channels(`lab(from ${color} l a b)`).c;
    const [lchL, lchC, lchH] = channels(`lch(from ${color} l c h)`).c;
    const p3 = channels(`color(from ${color} display-p3 r g b)`).c;
    const a = withAlpha(alpha);
    return {
      mapped,
      hex: bytes,
      values: {
        "out-hex": hex,
        "out-rgb": `rgb(${bytes.join(" ")}${a})`,
        "out-hsl": `hsl(${n(hue(s, hh, 3), 1)} ${n(s * 100, 1)}% ${n(l * 100, 1)}%${a})`,
        "out-oklch": `oklch(${n(okL, 4)} ${n(okC, 4)} ${n(hue(okC, okH, 4), 2)}${a})`,
        "out-oklab": `oklab(${n(oL, 4)} ${n(oA, 4)} ${n(oB, 4)}${a})`,
        "out-lab": `lab(${n(labL, 1)} ${n(labA, 1)} ${n(labB, 1)}${a})`,
        "out-lch": `lch(${n(lchL, 1)} ${n(lchC, 1)} ${n(hue(lchC, lchH, 1), 1)}${a})`,
        "out-display-p3": `color(display-p3 ${p3.map((v) => n(v, 3)).join(" ")}${a})`,
      },
    };
  }

  function update() {
    const color = input.value.trim();
    const ok = CSS.supports("color", color);
    $("error").hidden = ok;
    $("swatch").hidden = !ok;
    document.querySelectorAll("[data-copy]").forEach((btn) => (btn.disabled = !ok));
    if (!ok) {
      input.setAttribute("aria-invalid", "true");
      $("gamut").hidden = true;
      document.querySelectorAll("#outputs code").forEach((el) => (el.textContent = "–"));
      return;
    }
    input.removeAttribute("aria-invalid");

    const { mapped, hex, values } = convert(color);
    $("swatch").style.background = color;
    $("gamut").hidden = !mapped;
    picker.value = "#" + hex.map((v) => v.toString(16).padStart(2, "0")).join("");
    for (const [id, text] of Object.entries(values)) $(id).textContent = text;
  }

  input.addEventListener("input", update);
  picker.addEventListener("input", () => {
    input.value = picker.value;
    update();
  });

  document.querySelectorAll("[data-copy]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      await navigator.clipboard.writeText($(btn.dataset.copy).textContent);
      btn.textContent = "Copied";
      setTimeout(() => (btn.textContent = "Copy"), 1200);
    });
  });

  update();
})();
</script>
</body>
</html>
