<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NPK calculator</title>
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <style>
    .bar {
      display: flex;
      block-size: 1.25rem;
      border-radius: var(--border-radius-m);
      overflow: hidden;
      background: var(--color-border-weak);
    }
    .swatch {
      display: inline-block;
      inline-size: 0.75em;
      block-size: 0.75em;
      border-radius: 50%;
      margin-inline-end: var(--space-3xs);
    }
    /* Components are green (the accent), then Radix gold-9 and teal-9, which are the same in light and dark. */
    :root { --gold: #978365; --teal: #12a594; }
    .c1 { background: var(--color-accent); }
    .c2 { background: var(--gold); }
    .c3 { background: var(--teal); }
    .npk { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    #batch { inline-size: 10rem; }
    #result :is(th, td) { padding-inline: var(--space-2xs); }
    #result td:not(:first-child), #result th:not(:first-child) { text-align: end; white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <nav class="container">
      <ul><li><a href="../index.html">← Tools</a></li></ul>
    </nav>
  </header>

  <main class="container flow">
    <hgroup>
      <h1>NPK calculator</h1>
      <p>Find the mix of soil and fertilizer that best matches a plant's N, P and K needs. All values in g/kg (‰).</p>
    </hgroup>

    <div class="switcher gap-xl" style="--switcher-breakpoint: 48rem;">
      <div class="flow">
        <fieldset>
          <legend>Plant</legend>
          <label for="plant">Preset</label>
          <select id="plant"></select>
          <div class="grid npk" id="target"></div>
        </fieldset>

        <fieldset>
          <legend>Components</legend>
          <div class="cluster" role="radiogroup" aria-label="Number of components">
            <span><input type="radio" name="count" id="count-2" value="2" checked> <label for="count-2">2</label></span>
            <span><input type="radio" name="count" id="count-3" value="3"> <label for="count-3">3</label></span>
          </div>
          <div id="components" class="flow"></div>
        </fieldset>
      </div>

      <section id="result" class="card" aria-labelledby="result-heading">
        <h2 id="result-heading">Recommended mix</h2>
        <div class="flow-tight">
          <label for="batch">Batch size (kg)</label>
          <input type="number" id="batch" min="0" step="any" value="10">
        </div>
        <div id="output" class="flow"></div>
      </section>
    </div>
  </main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const NUTRIENTS = [["n", "N"], ["p", "P"], ["k", "K"]];

  const DEFAULT_PLANTS = [
    { name: "Potato",          n: 3.0,  p: 1.5, k: 5.0 },
    { name: "Strawberry",      n: 1.0,  p: 0.5, k: 2.4 },
    { name: "Asparagus",       n: 3.3,  p: 0.8, k: 2.5 },
    { name: "Cucumber",        n: 2.8,  p: 1.8, k: 5.0 },
    { name: "Celery",          n: 2.4,  p: 0.9, k: 3.4 },
    { name: "Cauliflower",     n: 3.8,  p: 0.9, k: 3.8 },
    { name: "Kale",            n: 4.0,  p: 1.4, k: 5.1 },
    { name: "Broccoli",        n: 4.8,  p: 1.7, k: 4.9 },
    { name: "Peas",            n: 7.7,  p: 1.7, k: 3.7 },
    { name: "Celeri",          n: 2.0,  p: 1.5, k: 5.6 },
    { name: "Swede (rutabaga)",n: 1.5,  p: 1.1, k: 2.6 },
    { name: "Beetroot",        n: 2.3,  p: 0.9, k: 4.7 },
    { name: "Lettuce",         n: 2.0,  p: 0.7, k: 3.7 },
    { name: "Carrot",          n: 1.3,  p: 0.7, k: 4.3 },
    { name: "Pumpkin",         n: 2.0,  p: 1.1, k: 3.1 },
    { name: "Leek",            n: 2.5,  p: 0.7, k: 3.5 },
    { name: "Brussels sprouts",n: 5.3,  p: 2.1, k: 5.9 },
    { name: "Tomato",          n: 2.5,  p: 0.9, k: 5.0 },
    { name: "Onion",           n: 2.3,  p: 0.7, k: 3.1 },
    { name: "White cabbage",   n: 2.6,  p: 1.1, k: 6.1 },
    { name: "Wheat",           n: 18.0, p: 8.7, k: 5.3 },
    { name: "Chili",           n: 12.6, p: 9.1, k: 9.1 },
  ];

  const DEFAULT_SOILS = [
    { name: "Nutritionless soil",   n: 0,  p: 0,  k: 0 },
    { name: "Oslo Compost (~1-1-40)", n: 0.11,  p: 0.074, k: 3.88 },
    { name: "Flower soil",   n: 0.42,  p: 0.14,  k: 0.5 },
    { name: "Generic plant soil",   n: 5.0,  p: 0.01,  k: 1.7 },
    { name: "Spagnum-free plant soil",   n: 4.55,  p: 0.45,  k: 1.31 },


  ];

  const DEFAULT_FERTILIZERS = [
    { name: "Industrial Fertilizer 12-4-18",               n: 118,   p: 40,    k: 176  },
    { name: "Chili Nutrient 4-3-5",                        n: 40,    p: 30,    k: 50   },
    { name: "Organic Nutrient 4-1-5",                      n: 40,    p: 4.4,   k: 50   },
    { name: "Chicken Manure",                              n: 40,    p: 15,    k: 20   },
    { name: "Composted Cow Manure 2:1:5",           n: 0.8,   p: 0.5,   k: 2    },
  ];

  const fmt = (v) => String(Number(v.toFixed(Math.abs(v) >= 100 ? 1 : Math.abs(v) >= 10 ? 2 : 3)));
  const pct = (v) => `${(v * 100).toFixed(1)}%`;
  const escape = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

  function mass(kg) {
    const g = kg * 1000;
    if (g >= 1000) return `${Number((g / 1000).toFixed(2))} kg`;
    return g >= 10 ? `${Math.round(g)} g` : `${Number(g.toFixed(1))} g`;
  }

  // Three N/P/K number fields; `name` prefixes their accessible names.
  function npkFields(prefix, name) {
    return NUTRIENTS.map(([key, label]) => `
      <div class="flow-tight">
        <label for="${prefix}-${key}">${label}</label>
        <input type="number" id="${prefix}-${key}" min="0" step="any" aria-label="${name} ${label} (g/kg)">
      </div>`).join("");
  }

  const read = (prefix) => Object.fromEntries(NUTRIENTS.map(([key]) => [key, Math.max(0, Number($(`${prefix}-${key}`).value) || 0)]));
  const fill = (prefix, item) => NUTRIENTS.forEach(([key]) => ($(`${prefix}-${key}`).value = item[key]));

  // ---------- Inputs ----------

  const CUSTOM = '<option value="">Custom</option>';
  const triple = (item) => `${fmt(item.n)} · ${fmt(item.p)} · ${fmt(item.k)}`;

  $("plant").innerHTML = CUSTOM + DEFAULT_PLANTS
    .map((p, i) => `<option value="${i}">${escape(p.name)} (${triple(p)})</option>`).join("");
  $("target").innerHTML = npkFields("target", "Plant");

  const PRESETS = [...DEFAULT_SOILS, ...DEFAULT_FERTILIZERS];
  const group = (label, list, offset) =>
    `<optgroup label="${label}">${list.map((c, i) => `<option value="${i + offset}">${escape(c.name)}</option>`).join("")}</optgroup>`;
  const presetOptions = CUSTOM + group("Soil", DEFAULT_SOILS, 0) + group("Fertilizer", DEFAULT_FERTILIZERS, DEFAULT_SOILS.length);

  $("components").innerHTML = [1, 2, 3].map((i) => `
    <div class="flow-tight" id="component-${i}">
      <label for="preset-${i}"><span class="swatch c${i}"></span>Component ${i}</label>
      <select id="preset-${i}">${presetOptions}</select>
      <div class="grid npk">${npkFields(`c${i}`, `Component ${i}`)}</div>
    </div>`).join("");

  // A preset fills its fields; editing a field switches the preset to "Custom".
  function linkPreset(select, prefix, list) {
    select.addEventListener("input", () => {
      if (select.value !== "") fill(prefix, list[select.value]);
      update();
    });
    NUTRIENTS.forEach(([key]) => $(`${prefix}-${key}`).addEventListener("input", () => {
      select.value = "";
      update();
    }));
  }
  linkPreset($("plant"), "target", DEFAULT_PLANTS);
  [1, 2, 3].forEach((i) => linkPreset($(`preset-${i}`), `c${i}`, PRESETS));

  const preset = (name) => String(PRESETS.findIndex((c) => c.name === name));
  [["plant", "0", DEFAULT_PLANTS, "target"],
   ["preset-1", preset("Oslo Compost (~1-1-40)"), PRESETS, "c1"],
   ["preset-2", preset("Chicken Manure"), PRESETS, "c2"],
   ["preset-3", preset("Organic Nutrient 4-1-5"), PRESETS, "c3"]].forEach(([id, value, list, prefix]) => {
    $(id).value = value;
    fill(prefix, list[value]);
  });

  document.querySelectorAll('[name="count"]').forEach((r) => r.addEventListener("input", update));
  $("batch").addEventListener("input", update);

  // ---------- Math ----------
  // Weights x_i ≥ 0 with Σx_i = 1 minimizing Σ_j (Σ_i x_i·c_ij − t_j)², where every nutrient is
  // divided by its target first, so N, P and K count equally (a target of 0 is measured in g/kg).

  const dot = (a, b) => a.reduce((s, v, i) => s + v * b[i], 0);
  const sub = (a, b) => a.map((v, i) => v - b[i]);
  const errorOf = (w, comps, t) => {
    const mix = t.map((_, j) => w.reduce((s, x, i) => s + x * comps[i][j], 0));
    return dot(sub(mix, t), sub(mix, t));
  };

  // Two components: the best x on the line a→b, clamped to [0, 1]. Null if a and b are identical.
  function fit2(a, b, t) {
    const d = sub(b, a), den = dot(d, d);
    if (den === 0) return null;
    const x = Math.min(1, Math.max(0, -dot(d, sub(a, t)) / den));
    return [1 - x, x];
  }

  // Three components: the unconstrained optimum if it's a valid mix, otherwise the best mix on an
  // edge (one component at 0%) or corner. The problem is convex, so that is the true optimum.
  function fit3(c1, c2, c3, t) {
    const a = sub(c1, c3), b = sub(c2, c3), d = sub(c3, t);
    const AA = dot(a, a), BB = dot(b, b), AB = dot(a, b), AD = dot(a, d), BD = dot(b, d);
    const det = AA * BB - AB * AB;
    if (Math.abs(det) > 1e-12) {
      const x1 = (AB * BD - BB * AD) / det, x2 = (AB * AD - AA * BD) / det;
      const w = [x1, x2, 1 - x1 - x2];
      if (w.every((v) => v >= -1e-9)) return w.map((v) => Math.max(0, v));
    }
    const pairs = [[0, 1], [0, 2], [1, 2]].map(([i, j]) => {
      const f = fit2([c1, c2, c3][i], [c1, c2, c3][j], t);
      if (!f) return null;
      const w = [0, 0, 0];
      [w[i], w[j]] = f;
      return w;
    }).filter(Boolean);
    if (!pairs.length) return null;
    const candidates = [...pairs, [1, 0, 0], [0, 1, 0], [0, 0, 1]];
    return candidates.reduce((best, w) => (errorOf(w, [c1, c2, c3], t) < errorOf(best, [c1, c2, c3], t) ? w : best));
  }

  // ---------- Result ----------

  function update() {
    const count = Number(document.querySelector('[name="count"]:checked').value);
    $("component-3").hidden = count < 3;

    const target = read("target");
    const comps = [1, 2, 3].slice(0, count).map((i) => ({
      name: $(`preset-${i}`).value === "" ? `Component ${i} (custom)` : PRESETS[$(`preset-${i}`).value].name,
      ...read(`c${i}`),
    }));
    const scale = NUTRIENTS.map(([key]) => target[key] || 1);
    const scaled = (c) => NUTRIENTS.map(([key], j) => c[key] / scale[j]);
    const t = scaled(target), cs = comps.map(scaled);
    const weights = count === 2 ? fit2(cs[0], cs[1], t) : fit3(cs[0], cs[1], cs[2], t);

    if (!weights) {
      $("output").innerHTML = `<p class="alert warning">The components have the same N, P and K, so every mix gives the same result.</p>`;
      return;
    }

    const batch = Math.max(0, Number($("batch").value) || 0);
    const mix = Object.fromEntries(NUTRIENTS.map(([key]) => [key, weights.reduce((s, w, i) => s + w * comps[i][key], 0)]));
    const relative = NUTRIENTS.map(([key], j) => (mix[key] - target[key]) / scale[j]);
    const rms = Math.sqrt(relative.reduce((s, r) => s + r * r, 0) / 3);
    const tone = (r) => (Math.abs(r) < 0.1 ? "fg-success" : Math.abs(r) < 0.3 ? "fg-warning" : "fg-danger");
    const unused = comps.filter((_, i) => weights[i] === 0);

    $("output").innerHTML = `
      <div class="bar" role="img" aria-label="Mix proportions">
        ${weights.map((w, i) => `<div class="c${i + 1}" style="inline-size: ${w * 100}%"></div>`).join("")}
      </div>
      <table class="full-width" id="mix">
        <thead><tr><th>Component</th><th>Share</th><th>Amount</th></tr></thead>
        <tbody>${comps.map((c, i) => `
          <tr>
            <td><span class="swatch c${i + 1}"></span>${escape(c.name)}</td>
            <td>${pct(weights[i])}</td>
            <td>${mass(batch * weights[i])}</td>
          </tr>`).join("")}
        </tbody>
      </table>
      ${unused.map((c) => `<p><small>${escape(c.name)} gets 0%: any amount of it moves the mix further from the target.</small></p>`).join("")}
      <table class="full-width" id="nutrients">
        <thead><tr><th>Nutrient</th><th>Target</th><th>Mix</th><th>Difference</th></tr></thead>
        <tbody>${NUTRIENTS.map(([key, label], j) => {
          const diff = mix[key] - target[key];
          const share = target[key] ? ` (${diff >= 0 ? "+" : ""}${Math.round(relative[j] * 100)}%)` : "";
          return `
          <tr>
            <td>${label}</td>
            <td>${fmt(target[key])}</td>
            <td>${fmt(mix[key])}</td>
            <td class="${tone(relative[j])}">${diff >= 0 ? "+" : ""}${fmt(diff)}${share}</td>
          </tr>`;
        }).join("")}
        </tbody>
      </table>
      <p id="fit">Average deviation from target: <strong>${Math.round(rms * 100)}%</strong> (RMS of the relative differences).</p>`;
  }

  update();
})();
</script>
</body>
</html>
