<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>color-mix() playground</title>
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <style>
    .result, .strip {
      border: var(--border-width) solid var(--color-border-weak);
      border-radius: var(--border-radius-m);
    }
    .result { block-size: 8rem; }
    .strip { position: relative; block-size: 2.5rem; background-origin: border-box; }
    input[type="color"] { flex: none; inline-size: 4rem; }
    .strip > span {
      position: absolute;
      inset-block: -0.25rem;
      inline-size: 3px;
      translate: -50%;
      background: var(--color-text);
      outline: 2px solid var(--color-surface);
    }
  </style>
</head>
<body>
  <header>
    <nav class="container slim">
      <ul><li><a href="../index.html">← Tools</a></li></ul>
    </nav>
  </header>

  <main class="container slim flow">
    <hgroup>
      <h1><code>color-mix()</code> playground</h1>
      <p>Mix two colors in any color space and copy the CSS.</p>
    </hgroup>

    <div class="grid halves">
      <div class="flow-tight">
        <label for="a">Color A</label>
        <fieldset role="group">
          <input id="a" type="text" value="#ff0066" spellcheck="false" autocomplete="off">
          <input id="a-picker" type="color" value="#ff0066" aria-label="Pick color A">
        </fieldset>
        <small id="a-error" hidden>Not a valid CSS color.</small>
      </div>
      <div class="flow-tight">
        <label for="b">Color B</label>
        <fieldset role="group">
          <input id="b" type="text" value="#00d4ff" spellcheck="false" autocomplete="off">
          <input id="b-picker" type="color" value="#00d4ff" aria-label="Pick color B">
        </fieldset>
        <small id="b-error" hidden>Not a valid CSS color.</small>
      </div>

      <div class="flow-tight">
        <label for="space">Color space</label>
        <select id="space">
          <optgroup label="Rectangular">
            <option>oklab</option>
            <option>lab</option>
            <option>srgb</option>
            <option>srgb-linear</option>
            <option>display-p3</option>
            <option>xyz</option>
            <option>xyz-d50</option>
          </optgroup>
          <optgroup label="Polar (hue)">
            <option>oklch</option>
            <option>lch</option>
            <option>hsl</option>
            <option>hwb</option>
          </optgroup>
        </select>
      </div>
      <div class="flow-tight" id="hue-field" hidden>
        <label for="hue">Hue interpolation</label>
        <select id="hue">
          <option>shorter</option>
          <option>longer</option>
          <option>increasing</option>
          <option>decreasing</option>
        </select>
      </div>
    </div>

    <div class="flow-tight">
      <label for="ratio">Amount of A: <output id="ratio-out" for="ratio">50%</output></label>
      <input id="ratio" type="range" min="0" max="100" value="50">
    </div>

    <div class="result" id="result" role="img" aria-label="Mixed color"></div>
    <div class="strip" id="strip" role="img" aria-label="Gradient from A to B"><span id="marker"></span></div>

    <div class="flow-tight">
      <div class="repel">
        <strong>Hex</strong>
        <button type="button" class="neutral small" data-copy="hex" aria-label="Copy hex">Copy</button>
      </div>
      <pre><code id="hex"></code></pre>
    </div>

    <div class="flow-tight">
      <div class="repel">
        <strong>Computed</strong>
        <button type="button" class="neutral small" data-copy="computed" aria-label="Copy computed">Copy</button>
      </div>
      <pre><code id="computed"></code></pre>
    </div>

    <div class="flow-tight">
      <div class="repel">
        <strong>CSS</strong>
        <button type="button" class="neutral small" data-copy="css" aria-label="Copy CSS">Copy</button>
      </div>
      <pre><code id="css"></code></pre>
    </div>
  </main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const a = $("a"), b = $("b"), space = $("space"), hue = $("hue"), ratio = $("ratio");
  const polar = ["oklch", "lch", "hsl", "hwb"];

  // Resolves any CSS color to what the browser computes, and to an sRGB hex via canvas.
  const probe = document.body.appendChild(document.createElement("div"));
  probe.hidden = true;
  const ctx = document.createElement("canvas").getContext("2d", { willReadFrequently: true });

  function resolve(color) {
    probe.style.color = color;
    return getComputedStyle(probe).color;
  }

  function toHex(color) {
    ctx.clearRect(0, 0, 1, 1);
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, 1, 1);
    const [r, g, bl] = ctx.getImageData(0, 0, 1, 1).data;
    return "#" + [r, g, bl].map((n) => n.toString(16).padStart(2, "0")).join("");
  }

  function checkColor(input) {
    const ok = CSS.supports("color", input.value.trim());
    $(input.id + "-error").hidden = ok;
    if (ok) {
      input.removeAttribute("aria-invalid");
      $(input.id + "-picker").value = toHex(resolve(input.value));
    } else {
      input.setAttribute("aria-invalid", "true");
    }
    return ok;
  }

  function update() {
    const isPolar = polar.includes(space.value);
    $("hue-field").hidden = !isPolar;
    $("ratio-out").value = ratio.value + "%";

    const okA = checkColor(a), okB = checkColor(b);
    const valid = okA && okB;
    ["result", "strip"].forEach((id) => ($(id).hidden = !valid));
    document.querySelectorAll("[data-copy]").forEach((btn) => (btn.disabled = !valid));
    if (!valid) {
      $("hex").textContent = $("computed").textContent = $("css").textContent = "–";
      return;
    }

    const A = a.value.trim(), B = b.value.trim();
    const method = `in ${space.value}${isPolar && hue.value !== "shorter" ? ` ${hue.value} hue` : ""}`;
    const pct = Number(ratio.value);
    const expr = `color-mix(${method}, ${pct === 50 ? A : `${A} ${pct}%`}, ${B})`;
    const computed = resolve(expr);

    $("result").style.background = expr;
    $("strip").style.backgroundImage = `linear-gradient(to right ${method}, ${A}, ${B})`;
    $("marker").style.insetInlineStart = 100 - pct + "%";
    $("hex").textContent = toHex(computed);
    $("computed").textContent = computed;
    $("css").textContent = expr;
  }

  [a, b].forEach((input) => {
    input.addEventListener("input", update);
    $(input.id + "-picker").addEventListener("input", (e) => {
      input.value = e.target.value;
      update();
    });
  });
  [space, hue, ratio].forEach((el) => el.addEventListener("input", update));

  document.querySelectorAll("[data-copy]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      await navigator.clipboard.writeText($(btn.dataset.copy).textContent);
      btn.textContent = "Copied";
      setTimeout(() => (btn.textContent = "Copy"), 1200);
    });
  });

  update();
})();
</script>
</body>
</html>
