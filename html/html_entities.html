<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HTML entity converter</title>
  <link rel="stylesheet" href="../styles/style.css">
  <style>
    textarea { font-family: var(--font-mono); }
  </style>
</head>
<body>
  <header>
    <nav class="container slim">
      <ul><li><a href="../index.html">← Tools</a></li></ul>
    </nav>
  </header>

  <main class="container slim flow">
    <hgroup>
      <h1>HTML entity converter</h1>
      <p>Type in either field and the other one updates. Escapes <code>&amp; &lt; &gt; "</code> and leaves existing entities alone.</p>
    </hgroup>

    <div class="flow-tight">
      <label for="text">Text</label>
      <textarea id="text" rows="8" spellcheck="false"></textarea>
    </div>

    <div class="flow-tight">
      <div class="repel">
        <label for="escaped">Escaped HTML</label>
        <button type="button" id="copy" class="neutral small">Copy</button>
      </div>
      <textarea id="escaped" rows="8" spellcheck="false"></textarea>
    </div>
  </main>

<script>
(() => {
  const text = document.getElementById("text");
  const escaped = document.getElementById("escaped");
  const copy = document.getElementById("copy");

  // An "&" that already starts an entity (&lt; &#60; &#x3C;) is kept, so nothing is double-encoded.
  const encode = (s) => s
    .replace(/&(?!(?:[a-z][a-z0-9]*|#\d+|#x[0-9a-f]+);)/gi, "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;");

  // A textarea parses its content as text, so this decodes every entity without creating elements.
  const decoder = document.createElement("textarea");
  const decode = (s) => {
    decoder.innerHTML = s;
    return decoder.value;
  };

  text.addEventListener("input", () => (escaped.value = encode(text.value)));
  escaped.addEventListener("input", () => (text.value = decode(escaped.value)));

  copy.addEventListener("click", async () => {
    await navigator.clipboard.writeText(escaped.value);
    copy.textContent = "Copied";
    setTimeout(() => (copy.textContent = "Copy"), 1200);
  });
})();
</script>
</body>
</html>
