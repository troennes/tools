<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Base64 encoder/decoder</title>
  <link rel="stylesheet" href="../styles/style.css">
  <style>
    textarea { font-family: var(--font-mono); }
  </style>
</head>
<body>
  <header>
    <nav class="container slim">
      <ul><li><a href="../index.html">← Tools</a></li></ul>
    </nav>
  </header>

  <main class="container slim flow">
    <hgroup>
      <h1>Base64 encoder/decoder</h1>
      <p>Type in either field and the other one updates. Text is UTF-8.</p>
    </hgroup>

    <div class="flow-tight">
      <label for="text">Text</label>
      <textarea id="text" rows="6" spellcheck="false"></textarea>
      <small id="text-note" hidden></small>
    </div>

    <div class="flow-tight">
      <div class="repel">
        <label for="b64">Base64</label>
        <button type="button" id="copy" class="secondary small">Copy</button>
      </div>
      <textarea id="b64" rows="6" spellcheck="false"></textarea>
      <small id="b64-error" hidden></small>
    </div>

    <label><input type="checkbox" role="switch" id="urlsafe"> URL-safe alphabet (<code>-_</code>, no padding)</label>

    <div class="flow-tight">
      <label for="file">Encode a file</label>
      <input type="file" id="file">
    </div>
  </main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const text = $("text"), b64 = $("b64"), urlsafe = $("urlsafe"), file = $("file");
  const textNote = $("text-note"), b64Error = $("b64-error"), copy = $("copy");

  // Last successfully encoded/decoded bytes, so the URL-safe toggle can re-encode them.
  let bytes = new Uint8Array();

  const encode = (data) => urlsafe.checked
    ? data.toBase64({ alphabet: "base64url", omitPadding: true })
    : data.toBase64();

  function decode(s) {
    // Accept both alphabets, wrapped lines and missing padding.
    s = s.replace(/\s+/g, "").replaceAll("-", "+").replaceAll("_", "/");
    return Uint8Array.fromBase64(s);
  }

  function showNote(el, msg) {
    el.textContent = msg ?? "";
    el.hidden = !msg;
  }

  function setB64Error(msg) {
    showNote(b64Error, msg);
    if (msg) b64.setAttribute("aria-invalid", "true");
    else b64.removeAttribute("aria-invalid");
  }

  function fromBytes(data) {
    bytes = data;
    b64.value = encode(data);
    setB64Error(null);
  }

  text.addEventListener("input", () => {
    file.value = "";
    showNote(textNote, null);
    fromBytes(new TextEncoder().encode(text.value));
  });

  b64.addEventListener("input", () => {
    file.value = "";
    showNote(textNote, null);
    let data;
    try {
      data = decode(b64.value);
    } catch {
      text.value = "";
      return setB64Error("Not valid Base64.");
    }
    bytes = data;
    try {
      text.value = new TextDecoder("utf-8", { fatal: true }).decode(data);
      setB64Error(null);
    } catch {
      text.value = "";
      setB64Error(`Valid Base64, but the ${data.length} bytes are not UTF-8 text.`);
    }
  });

  urlsafe.addEventListener("change", () => {
    if (!b64.hasAttribute("aria-invalid")) b64.value = encode(bytes);
  });

  file.addEventListener("change", async () => {
    const f = file.files[0];
    if (!f) return;
    text.value = "";
    fromBytes(new Uint8Array(await f.arrayBuffer()));
    showNote(textNote, `Encoded ${f.name} (${f.size.toLocaleString()} bytes).`);
  });

  copy.addEventListener("click", async () => {
    await navigator.clipboard.writeText(b64.value);
    copy.textContent = "Copied";
    setTimeout(() => (copy.textContent = "Copy"), 1200);
  });
})();
</script>
</body>
</html>
