<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hash text or file</title>
  <link rel="stylesheet" href="../styles/style.css">
  <link rel="stylesheet" href="../styles/theme.css">
  <style>
    textarea { font-family: var(--font-mono); font-size: var(--size-small); }
    #hashes :is(th, td) { padding-inline: var(--space-2xs); }
    #hashes th { white-space: nowrap; }
    #hashes code { word-break: break-all; }
    #hashes td:last-child { inline-size: 1%; }
    #hashes th .badge { display: block; inline-size: fit-content; margin-block-start: var(--space-3xs); }
    #hashes .badge[hidden] { display: none; }
  </style>
</head>
<body>
  <header>
    <nav class="container slim">
      <ul><li><a href="../index.html">← Tools</a></li></ul>
    </nav>
  </header>

  <main class="container slim flow">
    <hgroup>
      <h1>Hash text or file</h1>
      <p>Checksums and hashes, computed locally.</p>
    </hgroup>

    <div class="flow-tight">
      <label for="text">Text</label>
      <textarea id="text" rows="6" spellcheck="false"></textarea>
    </div>

    <div class="flow-tight">
      <label for="file">Or hash a file</label>
      <input type="file" id="file">
      <small id="file-note" hidden></small>
    </div>

    <div class="flow-tight">
      <label for="compare">Compare with</label>
      <input type="text" id="compare" spellcheck="false" autocomplete="off" placeholder="Paste an expected hash">
      <small id="compare-note" hidden></small>
    </div>

    <table class="full-width">
      <tbody id="hashes"></tbody>
    </table>
  </main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const text = $("text"), file = $("file"), compare = $("compare");

  function toHex(u8){
    let s = "";
    for (let i=0;i<u8.length;i++) s += u8[i].toString(16).padStart(2,"0");
    return s;
  }

  function u32ToHexBE(words, bytes){
    const out = new Uint8Array(bytes);
    for (let i=0;i<bytes/4;i++){
      const w = words[i] >>> 0;
      out[i*4+0] = (w>>>24)&255;
      out[i*4+1] = (w>>>16)&255;
      out[i*4+2] = (w>>>8)&255;
      out[i*4+3] = (w)&255;
    }
    return toHex(out);
  }

  // --------- cksum (POSIX CRC-32 + length) ---------
  const CRC32_TAB = (() => {
    const t = new Uint32Array(256);
    for (let i=0;i<256;i++){
      let c = (i<<24) >>> 0;
      for (let k=0;k<8;k++){
        c = (c & 0x80000000) ? (((c<<1) ^ 0x04C11DB7) >>> 0) : ((c<<1)>>>0);
      }
      t[i] = c >>> 0;
    }
    return t;
  })();

  function cksumPosix(u8){
    let crc = 0 >>> 0;
    for (let i=0;i<u8.length;i++){
      const idx = ((crc>>>24) ^ u8[i]) & 0xFF;
      crc = (CRC32_TAB[idx] ^ ((crc<<8)>>>0)) >>> 0;
    }
    let len = u8.length >>> 0;
    let n = len;
    while (n > 0){
      const b = n & 0xFF;
      const idx = ((crc>>>24) ^ b) & 0xFF;
      crc = (CRC32_TAB[idx] ^ ((crc<<8)>>>0)) >>> 0;
      n = Math.floor(n / 256);
    }
    crc = (~crc) >>> 0;
    return `${crc} ${len}`;
  }

  // --------- MD5 ---------
  function md5Hex(u8){
    const origLen = u8.length;
    const bitLenLo = (origLen * 8) >>> 0;
    const bitLenHi = Math.floor((origLen * 8) / 0x100000000) >>> 0;

    const padLen = ((56 - ((origLen + 1) % 64)) + 64) % 64;
    const total = origLen + 1 + padLen + 8;
    const buf = new Uint8Array(total);
    buf.set(u8);
    buf[origLen] = 0x80;
    buf[total-8] = bitLenLo & 255;
    buf[total-7] = (bitLenLo>>>8)&255;
    buf[total-6] = (bitLenLo>>>16)&255;
    buf[total-5] = (bitLenLo>>>24)&255;
    buf[total-4] = bitLenHi & 255;
    buf[total-3] = (bitLenHi>>>8)&255;
    buf[total-2] = (bitLenHi>>>16)&255;
    buf[total-1] = (bitLenHi>>>24)&255;

    let a0 = 0x67452301|0, b0 = 0xefcdab89|0, c0 = 0x98badcfe|0, d0 = 0x10325476|0;
    const T = MD5_T;

    for (let off=0; off<buf.length; off+=64){
      let A=a0|0, B=b0|0, C=c0|0, D=d0|0;
      const X = new Int32Array(16);
      for (let i=0;i<16;i++){
        const j = off + i*4;
        X[i] = (buf[j] | (buf[j+1]<<8) | (buf[j+2]<<16) | (buf[j+3]<<24)) | 0;
      }

      A = ff(A,B,C,D,X[0], 7, T[0]);
      D = ff(D,A,B,C,X[1],12, T[1]);
      C = ff(C,D,A,B,X[2],17, T[2]);
      B = ff(B,C,D,A,X[3],22, T[3]);
      A = ff(A,B,C,D,X[4], 7, T[4]);
      D = ff(D,A,B,C,X[5],12, T[5]);
      C = ff(C,D,A,B,X[6],17, T[6]);
      B = ff(B,C,D,A,X[7],22, T[7]);
      A = ff(A,B,C,D,X[8], 7, T[8]);
      D = ff(D,A,B,C,X[9],12, T[9]);
      C = ff(C,D,A,B,X[10],17,T[10]);
      B = ff(B,C,D,A,X[11],22,T[11]);
      A = ff(A,B,C,D,X[12], 7,T[12]);
      D = ff(D,A,B,C,X[13],12,T[13]);
      C = ff(C,D,A,B,X[14],17,T[14]);
      B = ff(B,C,D,A,X[15],22,T[15]);

      A = gg(A,B,C,D,X[1], 5, T[16]);
      D = gg(D,A,B,C,X[6], 9, T[17]);
      C = gg(C,D,A,B,X[11],14,T[18]);
      B = gg(B,C,D,A,X[0],20, T[19]);
      A = gg(A,B,C,D,X[5], 5, T[20]);
      D = gg(D,A,B,C,X[10], 9,T[21]);
      C = gg(C,D,A,B,X[15],14,T[22]);
      B = gg(B,C,D,A,X[4],20, T[23]);
      A = gg(A,B,C,D,X[9], 5, T[24]);
      D = gg(D,A,B,C,X[14], 9,T[25]);
      C = gg(C,D,A,B,X[3],14, T[26]);
      B = gg(B,C,D,A,X[8],20, T[27]);
      A = gg(A,B,C,D,X[13],5, T[28]);
      D = gg(D,A,B,C,X[2], 9, T[29]);
      C = gg(C,D,A,B,X[7],14, T[30]);
      B = gg(B,C,D,A,X[12],20,T[31]);

      A = hh(A,B,C,D,X[5], 4, T[32]);
      D = hh(D,A,B,C,X[8],11, T[33]);
      C = hh(C,D,A,B,X[11],16,T[34]);
      B = hh(B,C,D,A,X[14],23,T[35]);
      A = hh(A,B,C,D,X[1], 4, T[36]);
      D = hh(D,A,B,C,X[4],11, T[37]);
      C = hh(C,D,A,B,X[7],16, T[38]);
      B = hh(B,C,D,A,X[10],23,T[39]);
      A = hh(A,B,C,D,X[13],4, T[40]);
      D = hh(D,A,B,C,X[0],11, T[41]);
      C = hh(C,D,A,B,X[3],16, T[42]);
      B = hh(B,C,D,A,X[6],23, T[43]);
      A = hh(A,B,C,D,X[9], 4, T[44]);
      D = hh(D,A,B,C,X[12],11,T[45]);
      C = hh(C,D,A,B,X[15],16,T[46]);
      B = hh(B,C,D,A,X[2],23, T[47]);

      A = ii(A,B,C,D,X[0], 6, T[48]);
      D = ii(D,A,B,C,X[7],10, T[49]);
      C = ii(C,D,A,B,X[14],15,T[50]);
      B = ii(B,C,D,A,X[5],21, T[51]);
      A = ii(A,B,C,D,X[12],6, T[52]);
      D = ii(D,A,B,C,X[3],10, T[53]);
      C = ii(C,D,A,B,X[10],15,T[54]);
      B = ii(B,C,D,A,X[1],21, T[55]);
      A = ii(A,B,C,D,X[8], 6, T[56]);
      D = ii(D,A,B,C,X[15],10,T[57]);
      C = ii(C,D,A,B,X[6],15, T[58]);
      B = ii(B,C,D,A,X[13],21,T[59]);
      A = ii(A,B,C,D,X[4], 6, T[60]);
      D = ii(D,A,B,C,X[11],10,T[61]);
      C = ii(C,D,A,B,X[2],15, T[62]);
      B = ii(B,C,D,A,X[9],21, T[63]);

      a0 = (a0 + A) | 0;
      b0 = (b0 + B) | 0;
      c0 = (c0 + C) | 0;
      d0 = (d0 + D) | 0;
    }

    const out = new Uint8Array(16);
    writeLE32(out, 0, a0);
    writeLE32(out, 4, b0);
    writeLE32(out, 8, c0);
    writeLE32(out, 12, d0);
    return toHex(out);
  }

  function writeLE32(u8, off, v){
    u8[off] = v & 255;
    u8[off+1] = (v>>>8)&255;
    u8[off+2] = (v>>>16)&255;
    u8[off+3] = (v>>>24)&255;
  }

  function rotl(x, n){ return (x << n) | (x >>> (32 - n)); }
  function ff(a,b,c,d,x,s,t){ return (b + rotl((a + ((b & c) | (~b & d)) + x + t)|0, s))|0; }
  function gg(a,b,c,d,x,s,t){ return (b + rotl((a + ((b & d) | (c & ~d)) + x + t)|0, s))|0; }
  function hh(a,b,c,d,x,s,t){ return (b + rotl((a + (b ^ c ^ d) + x + t)|0, s))|0; }
  function ii(a,b,c,d,x,s,t){ return (b + rotl((a + (c ^ (b | ~d)) + x + t)|0, s))|0; }

  const MD5_T = (() => {
    const T = new Int32Array(64);
    for (let i=0;i<64;i++) T[i] = (Math.floor(Math.abs(Math.sin(i+1)) * 4294967296) | 0);
    return T;
  })();

  // --------- SHA-224 ---------
  const SHA256_K = new Uint32Array([
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ]);

  function sha224Hex(u8){
    let h0 = 0xc1059ed8, h1 = 0x367cd507, h2 = 0x3070dd17, h3 = 0xf70e5939,
        h4 = 0xffc00b31, h5 = 0x68581511, h6 = 0x64f98fa7, h7 = 0xbefa4fa4;

    const l = u8.length;
    const bitHi = Math.floor((l * 8) / 0x100000000) >>> 0;
    const bitLo = (l * 8) >>> 0;
    const padLen = ((56 - ((l + 1) % 64)) + 64) % 64;
    const total = l + 1 + padLen + 8;
    const buf = new Uint8Array(total);
    buf.set(u8);
    buf[l] = 0x80;
    buf[total-8] = (bitHi>>>24)&255;
    buf[total-7] = (bitHi>>>16)&255;
    buf[total-6] = (bitHi>>>8)&255;
    buf[total-5] = (bitHi)&255;
    buf[total-4] = (bitLo>>>24)&255;
    buf[total-3] = (bitLo>>>16)&255;
    buf[total-2] = (bitLo>>>8)&255;
    buf[total-1] = (bitLo)&255;

    const W = new Uint32Array(64);
    for (let off=0; off<buf.length; off+=64){
      for (let i=0;i<16;i++){
        const j = off + i*4;
        W[i] = ((buf[j]<<24) | (buf[j+1]<<16) | (buf[j+2]<<8) | (buf[j+3])) >>> 0;
      }
      for (let i=16;i<64;i++){
        const s0 = rotr(W[i-15],7) ^ rotr(W[i-15],18) ^ (W[i-15]>>>3);
        const s1 = rotr(W[i-2],17) ^ rotr(W[i-2],19) ^ (W[i-2]>>>10);
        W[i] = (W[i-16] + s0 + W[i-7] + s1) >>> 0;
      }

      let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
      for (let i=0;i<64;i++){
        const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
        const ch = (e & f) ^ (~e & g);
        const temp1 = (h + S1 + ch + SHA256_K[i] + W[i]) >>> 0;
        const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const temp2 = (S0 + maj) >>> 0;
        h=g; g=f; f=e; e=(d + temp1)>>>0;
        d=c; c=b; b=a; a=(temp1 + temp2)>>>0;
      }

      h0 = (h0 + a)>>>0; h1 = (h1 + b)>>>0; h2 = (h2 + c)>>>0; h3 = (h3 + d)>>>0;
      h4 = (h4 + e)>>>0; h5 = (h5 + f)>>>0; h6 = (h6 + g)>>>0; h7 = (h7 + h)>>>0;
    }

    const words = new Uint32Array([h0,h1,h2,h3,h4,h5,h6]);
    return u32ToHexBE(words, 28);
  }

  function rotr(x,n){ return (x>>>n) | (x<<(32-n)); }

  // SHA3-256 (FIPS 202). Each 64-bit lane is stored as two 32-bit halves: lo at 2i, hi at 2i+1.
  const KECCAK_RC = [
    1, 0, 32898, 0, 32906, 2147483648, 2147516416, 2147483648, 32907, 0, 2147483649, 0,
    2147516545, 2147483648, 32777, 2147483648, 138, 0, 136, 0, 2147516425, 0, 2147483658, 0,
    2147516555, 0, 139, 2147483648, 32905, 2147483648, 32771, 2147483648, 32770, 2147483648,
    128, 2147483648, 32778, 0, 2147483658, 2147483648, 2147516545, 2147483648, 32896, 2147483648,
    2147483649, 0, 2147516424, 2147483648,
  ];
  // Rotation offset for lane x + 5y.
  const KECCAK_ROT = [0, 1, 62, 28, 27, 36, 44, 6, 55, 20, 3, 10, 43, 25, 39, 41, 45, 15, 21, 8, 18, 2, 61, 56, 14];

  function keccakF(s) {
    const c = new Uint32Array(10), b = new Uint32Array(50);
    for (let round = 0; round < 24; round++) {
      // θ
      for (let x = 0; x < 5; x++) {
        c[2 * x] = s[2 * x] ^ s[2 * x + 10] ^ s[2 * x + 20] ^ s[2 * x + 30] ^ s[2 * x + 40];
        c[2 * x + 1] = s[2 * x + 1] ^ s[2 * x + 11] ^ s[2 * x + 21] ^ s[2 * x + 31] ^ s[2 * x + 41];
      }
      for (let x = 0; x < 5; x++) {
        const l = 2 * ((x + 4) % 5), r = 2 * ((x + 1) % 5);
        const dLo = c[l] ^ ((c[r] << 1) | (c[r + 1] >>> 31));
        const dHi = c[l + 1] ^ ((c[r + 1] << 1) | (c[r] >>> 31));
        for (let y = 0; y < 25; y += 5) {
          s[2 * (x + y)] ^= dLo;
          s[2 * (x + y) + 1] ^= dHi;
        }
      }
      // ρ and π
      for (let x = 0; x < 5; x++) {
        for (let y = 0; y < 5; y++) {
          const i = x + 5 * y, n = KECCAK_ROT[i], j = y + 5 * ((2 * x + 3 * y) % 5);
          let lo = s[2 * i], hi = s[2 * i + 1];
          if (n >= 32) [lo, hi] = [hi, lo];
          const m = n % 32;
          b[2 * j] = m ? (lo << m) | (hi >>> (32 - m)) : lo;
          b[2 * j + 1] = m ? (hi << m) | (lo >>> (32 - m)) : hi;
        }
      }
      // χ
      for (let y = 0; y < 25; y += 5) {
        for (let x = 0; x < 5; x++) {
          const i = 2 * (x + y), i1 = 2 * (((x + 1) % 5) + y), i2 = 2 * (((x + 2) % 5) + y);
          s[i] = b[i] ^ (~b[i1] & b[i2]);
          s[i + 1] = b[i + 1] ^ (~b[i1 + 1] & b[i2 + 1]);
        }
      }
      // ι
      s[0] ^= KECCAK_RC[2 * round];
      s[1] ^= KECCAK_RC[2 * round + 1];
    }
  }

  function sha3_256(data) {
    const rate = 136, s = new Uint32Array(50);
    const absorb = (block) => {
      for (let i = 0; i < rate / 4; i++) {
        s[i] ^= block[4 * i] | (block[4 * i + 1] << 8) | (block[4 * i + 2] << 16) | (block[4 * i + 3] << 24);
      }
      keccakF(s);
    };
    let off = 0;
    for (; off + rate <= data.length; off += rate) absorb(data.subarray(off, off + rate));
    const last = new Uint8Array(rate);
    last.set(data.subarray(off));
    last[data.length - off] ^= 0x06;
    last[rate - 1] ^= 0x80;
    absorb(last);
    return toHex(new Uint8Array(s.buffer, 0, 32));
  }

  const subtle = (name) => async (data) => toHex(new Uint8Array(await crypto.subtle.digest(name, data)));
  const ALGORITHMS = [
    ["sha256", "SHA-256", subtle("SHA-256")],
    ["sha512", "SHA-512", subtle("SHA-512")],
    ["sha1", "SHA-1", subtle("SHA-1")],
    ["md5", "MD5", md5Hex],
    ["sha384", "SHA-384", subtle("SHA-384")],
    ["sha224", "SHA-224", sha224Hex],
    ["sha3-256", "SHA3-256", sha3_256],
    ["cksum", "cksum", cksumPosix],
  ];

  for (const [id, name] of ALGORITHMS) {
    $("hashes").insertAdjacentHTML("beforeend", `
      <tr>
        <th scope="row">${name} <span class="badge success" id="match-${id}" hidden>Match</span></th>
        <td><code id="out-${id}">–</code></td>
        <td><button type="button" class="neutral small" data-copy="out-${id}" aria-label="Copy ${name}" disabled>Copy</button></td>
      </tr>`);
  }

  // Ignores results from an older input that finish after a newer one.
  let run = 0;
  async function hash(data) {
    const current = ++run;
    const values = data ? await Promise.all(ALGORITHMS.map(([, , fn]) => fn(data))) : null;
    if (current !== run) return;
    ALGORITHMS.forEach(([id], i) => ($("out-" + id).textContent = values ? values[i] : "–"));
    document.querySelectorAll("[data-copy]").forEach((btn) => (btn.disabled = !values));
    check();
  }

  // Accepts a bare hash or a "hash  filename" line as printed by sha256sum and friends.
  function check() {
    const want = compare.value.trim().toLowerCase().replace(/\s+/g, " ");
    const note = $("compare-note");
    let matched = null;
    for (const [id, name] of ALGORITHMS) {
      const value = $("out-" + id).textContent;
      const hit = value !== "–" && want !== "" && (want === value || want.startsWith(value + " "));
      $("match-" + id).hidden = !hit;
      if (hit) matched = name;
    }
    if (!want || $("out-sha256").textContent === "–") {
      note.hidden = true;
      compare.removeAttribute("aria-invalid");
      return;
    }
    note.hidden = false;
    note.textContent = matched ? `Matches ${matched}.` : "Doesn't match any of the hashes.";
    compare.setAttribute("aria-invalid", String(!matched));
  }

  const showFile = (msg) => {
    $("file-note").textContent = msg ?? "";
    $("file-note").hidden = !msg;
  };

  text.addEventListener("input", () => {
    file.value = "";
    showFile(null);
    hash(text.value ? new TextEncoder().encode(text.value) : null);
  });

  file.addEventListener("change", async () => {
    const f = file.files[0];
    if (!f) return;
    text.value = "";
    showFile(`Hashing ${f.name} (${f.size.toLocaleString()} bytes).`);
    await hash(new Uint8Array(await f.arrayBuffer()));
    showFile(`${f.name} (${f.size.toLocaleString()} bytes).`);
  });

  compare.addEventListener("input", check);

  document.querySelectorAll("[data-copy]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      await navigator.clipboard.writeText($(btn.dataset.copy).textContent);
      btn.textContent = "Copied";
      setTimeout(() => (btn.textContent = "Copy"), 1200);
    });
  });
})();
</script>
</body>
</html>
