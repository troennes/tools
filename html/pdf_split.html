<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PDF splitter</title>
  <link rel="stylesheet" href="../styles/style.css">
  <style>
    #editor small code { white-space: nowrap; }
  </style>
</head>
<body>
  <header>
    <nav class="container slim">
      <ul><li><a href="../index.html">← Tools</a></li></ul>
    </nav>
  </header>

  <main class="container slim flow">
    <hgroup>
      <h1>PDF splitter</h1>
      <p>Keep, reorder or repeat pages of a PDF and download the result. Nothing is uploaded.</p>
    </hgroup>

    <div class="flow-tight">
      <label for="file">PDF</label>
      <input type="file" id="file" accept="application/pdf,.pdf">
      <small id="file-note">You can also drop a PDF anywhere on the page.</small>
    </div>

    <div id="editor" class="flow" hidden>
      <div class="flow-tight">
        <label for="pages">Pages</label>
        <input type="text" id="pages" spellcheck="false" autocomplete="off">
        <small id="pages-note"></small>
      </div>
      <p><small class="fg-muted">Use commas and ranges, in the order you want: <code>1,3-5,10</code>, <code>8-</code> for page 8 to the end, <code>5-1</code> for reverse.</small></p>
      <div>
        <button type="button" id="download">Download</button>
      </div>
    </div>
  </main>

<script src="../vendor/pdf-lib/pdf-lib.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const file = $("file"), pages = $("pages"), note = $("pages-note");

  let source = null; // the loaded PDFLib.PDFDocument
  let name = "document";

  const plural = (n, word) => `${n} ${word}${n === 1 ? "" : "s"}`;

  // "1,3-5,8-,-2,5-1" → 1-based page numbers in the order given. Throws with a readable message.
  function parsePages(spec, count) {
    const out = [];
    for (const raw of spec.split(",")) {
      const part = raw.replace(/\s+/g, "");
      if (!part) continue;
      const m = part.match(/^(\d+)$|^(\d*)-(\d*)$/);
      if (!m || part === "-") throw new Error(`"${raw.trim()}" isn't a page or range.`);
      const [from, to] = m[1] ? [Number(m[1]), Number(m[1])] : [Number(m[2] || 1), Number(m[3] || count)];
      for (const n of [from, to]) {
        if (n < 1 || n > count) throw new Error(`There is no page ${n}; the PDF has ${plural(count, "page")}.`);
      }
      const step = from <= to ? 1 : -1;
      for (let n = from; n !== to + step; n += step) out.push(n);
    }
    return out;
  }

  // [1,3,4,5,10] → "1, 3–5, 10"
  function describe(list) {
    const runs = [];
    for (const n of list) {
      const run = runs.at(-1);
      if (run && n === run[1] + 1) run[1] = n;
      else runs.push([n, n]);
    }
    return runs.map(([a, b]) => (a === b ? a : `${a}–${b}`)).join(", ");
  }

  function check() {
    const count = source.getPageCount();
    let list;
    try {
      list = parsePages(pages.value, count);
      if (!list.length) throw new Error("Enter the pages to keep.");
    } catch (e) {
      pages.setAttribute("aria-invalid", "true");
      note.textContent = e.message;
      $("download").disabled = true;
      return null;
    }
    pages.removeAttribute("aria-invalid");
    note.textContent = `New PDF: ${plural(list.length, "page")} (${describe(list)}), from ${count}.`;
    $("download").disabled = false;
    return list;
  }

  async function load(f) {
    if (!f) return;
    try {
      source = await PDFLib.PDFDocument.load(await f.arrayBuffer());
    } catch (e) {
      source = null;
      $("editor").hidden = true;
      file.setAttribute("aria-invalid", "true");
      $("file-note").textContent = /encrypted/i.test(e.message)
        ? "This PDF is password-protected, so its pages can't be copied."
        : "That file isn't a PDF this tool can read.";
      return;
    }
    const count = source.getPageCount();
    name = f.name.replace(/\.pdf$/i, "") || "document";
    file.removeAttribute("aria-invalid");
    $("file-note").textContent = `${f.name} (${plural(count, "page")}).`;
    $("editor").hidden = false;
    pages.value = count === 1 ? "1" : `1-${count}`;
    check();
  }

  file.addEventListener("change", () => load(file.files[0]));
  document.addEventListener("dragover", (e) => e.preventDefault());
  document.addEventListener("drop", (e) => {
    e.preventDefault();
    load(e.dataTransfer.files[0]);
  });

  pages.addEventListener("input", check);

  $("download").addEventListener("click", async () => {
    const list = check();
    if (!list) return;
    const out = await PDFLib.PDFDocument.create();
    const copied = await out.copyPages(source, list.map((n) => n - 1));
    copied.forEach((page) => out.addPage(page));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([await out.save()], { type: "application/pdf" }));
    a.download = `${name}-pages.pdf`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
})();
</script>
</body>
</html>
